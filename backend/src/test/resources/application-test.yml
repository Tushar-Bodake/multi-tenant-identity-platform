spring:
  datasource:
    url: jdbc:h2:mem:securegate_test;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
  flyway:
    enabled: false
  data:
    redis:
      repositories:
        enabled: false
  mail:
    host: localhost
    port: 1025

securegate:
  app-base-url: http://localhost:3000
  jwt:
    issuer: https://auth.securegate.test
    audience: securegate-test
    access-token-expiration-seconds: 300
    refresh-token-expiration-seconds: 3600
  webauthn:
    rp-name: SecureGateTest
    rp-id: localhost
    origin: http://localhost:3000
  magic-link:
    expiration-minutes: 15
